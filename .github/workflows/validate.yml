# SPDX-License-Identifier: MIT
#
# Gate every PR on the catalog contract:
#   - each skill's frontmatter, required artifacts, and eval task set
#   - each skills/ dir is registered in components.d or excepted
#   - the generated surfaces (README table, skills.sh.json, plugins/,
#     marketplace manifests) match what the sources produce
#   - the skills' own smoke tests still pass
#
# Everything generated is checked rather than regenerated here: a job
# that silently regenerates hides the drift instead of reporting it.

name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure yq and jq
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          if ! command -v yq >/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version
          jq --version

      - name: Validate skill contract
        run: bash .github/scripts/validate-skills.sh

      - name: Check generated catalog surfaces
        run: bash .github/scripts/gen-catalog.sh --check

      - name: Check generated plugin tree
        run: bash .github/scripts/build-plugins.sh --check

      - name: Validate component registrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(components.d/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No components.d registrations — nothing to validate."
            exit 0
          fi

          status=0
          seen=$(mktemp)
          for f in "${files[@]}"; do
            for field in name repo description; do
              value=$(yq -r ".$field // \"\"" "$f")
              [ -n "$value" ] || { echo "✗ $f is missing '$field'"; status=1; }
            done

            count=$(yq -r '.skills | length' "$f")
            if [ "$count" = "null" ] || [ "$count" -eq 0 ]; then
              echo "✗ $f declares no skills"
              status=1
              continue
            fi

            for i in $(seq 0 $((count - 1))); do
              path=$(yq -r ".skills[$i].path // \"\"" "$f")
              dir=$(yq -r ".skills[$i].catalog_dir // \"\"" "$f")
              [ -n "$path" ] || { echo "✗ $f skills[$i] is missing 'path'"; status=1; }
              [ -n "$dir" ]  || { echo "✗ $f skills[$i] is missing 'catalog_dir'"; status=1; continue; }
              # catalog_dir must be unique across the whole registry — two
              # components claiming one dir would silently overwrite each
              # other on every sync.
              if grep -qxF "$dir" "$seen"; then
                echo "✗ catalog_dir '$dir' is declared more than once"
                status=1
              fi
              echo "$dir" >> "$seen"
            done
          done

          [ "$status" -eq 0 ] && echo "✓ ${#files[@]} component file(s) valid"
          exit "$status"

      - name: Run skill smoke tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for script in skills/*/tests/*.sh; do
            found=1
            echo "── $script"
            bash "$script"
          done
          if [ "$found" -eq 0 ]; then
            echo "No smoke tests found — skipping."
          fi
